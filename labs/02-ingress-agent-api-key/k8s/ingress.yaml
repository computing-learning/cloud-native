# Broad application routes are unchanged and do not require the agent API key.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-internal
  namespace: cloud-native-lab
spec:
  ingressClassName: nginx
  rules:
    - host: gateway.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hub
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
# Exact agent endpoints require API-key authentication.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-agent
  namespace: cloud-native-lab
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://api-key-auth.cloud-native-lab.svc.cluster.local/authorize"
spec:
  ingressClassName: nginx
  rules:
    - host: gateway.local
      http:
        paths:
          - path: /api/a2a/agent-card.json
            pathType: Exact
            backend:
              service:
                name: hub
                port:
                  name: http
          - path: /api/mcp
            pathType: Exact
            backend:
              service:
                name: hub
                port:
                  name: http
          - path: /api/a2a
            pathType: Exact
            backend:
              service:
                name: hub
                port:
                  name: http

apiVersion: v1
kind: Secret
metadata:
  name: agent-api-key
  namespace: cloud-native-lab
type: Opaque
stringData:
  api-key: lab-agent-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-key-auth
  namespace: cloud-native-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-key-auth
  template:
    metadata:
      labels:
        app: api-key-auth
    spec:
      containers:
        - name: api-key-auth
          image: ingress-api-key-auth:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: AGENT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-api-key
                  key: api-key
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: api-key-auth
  namespace: cloud-native-lab
spec:
  selector:
    app: api-key-auth
  ports:
    - name: http
      port: 80
      targetPort: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub
  namespace: cloud-native-lab
  labels:
    app.kubernetes.io/name: hub
    app.kubernetes.io/part-of: ingress-agent-routing-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hub
        app.kubernetes.io/part-of: ingress-agent-routing-lab
    spec:
      containers:
        - name: hub
          image: ingress-routing-hub:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: hub
  namespace: cloud-native-lab
  labels:
    app.kubernetes.io/name: hub
    app.kubernetes.io/part-of: ingress-agent-routing-lab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hub
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP

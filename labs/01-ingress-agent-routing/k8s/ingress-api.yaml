apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-api
  namespace: cloud-native-lab
  annotations:
    nginx.ingress.kubernetes.io/allowlist-source-range: "INTERNAL_CIDR"
spec:
  ingressClassName: nginx
  rules:
    - host: gateway.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hub
                port:
                  name: http

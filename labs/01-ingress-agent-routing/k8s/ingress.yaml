# ============================================================
# Internal frontend and REST API
#
# Simulated external-agent source IP:
#   172.20.0.1
#
# This IP is denied from:
#   /
#   /api/*
#
# No URL rewrite.
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-internal
  namespace: cloud-native-lab
  annotations:
    nginx.ingress.kubernetes.io/denylist-source-range: "172.20.0.1/32"
spec:
  ingressClassName: nginx
  rules:
    - host: gateway.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hub
                port:
                  name: http

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http

---
# ============================================================
# External-agent exceptions
#
# Simulated external-agent source IP:
#   172.20.0.1
#
# This IP is allowed to access only:
#   POST /api/mcp
#   POST /api/a2a
#   GET  /api/a2a/agent-card.json
#
# Exact paths prevent other Hub APIs from being exposed.
# No URL rewrite.
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-agent
  namespace: cloud-native-lab
  annotations:
    nginx.ingress.kubernetes.io/allowlist-source-range: "172.20.0.1/32"
spec:
  ingressClassName: nginx
  rules:
    - host: gateway.local
      http:
        paths:
          - path: agent-card.json
            pathType: Exact
            backend:
              service:
                name: hub
                port:
                  name: http

          - path: /api/mcp
            pathType: Exact
            backend:
              service:
                name: hub
                port:
                  name: http

          - path: /api/a2a
            pathType: Exact
            backend:
              service:
                name: hub
                port:
                  name: http

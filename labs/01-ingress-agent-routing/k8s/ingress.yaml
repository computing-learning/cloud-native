# Broad internal routes: the simulated external IP is denied.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-internal
  namespace: cloud-native-lab
  annotations:
#    nginx.ingress.kubernetes.io/denylist-source-range: "172.20.0.1/32"
    nginx.ingress.kubernetes.io/denylist-source-range: "172.20.0.1/32"
spec:
  ingressClassName: nginx
  rules:
    - host: gateway.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hub
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
---
# Narrow integration exceptions: the same simulated external IP is allowed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-agent
  namespace: cloud-native-lab
  annotations:
#    nginx.ingress.kubernetes.io/allowlist-source-range: "172.20.0.1/32"
    nginx.ingress.kubernetes.io/allowlist-source-range: "172.20.0.1/32"
spec:
  ingressClassName: nginx
  rules:
    - host: gateway.local
      http:
        paths:
          - path: /api/a2a/agent-card.json
            pathType: Exact
            backend:
              service:
                name: hub
                port:
                  name: http
          - path: /api/mcp
            pathType: Exact
            backend:
              service:
                name: hub
                port:
                  name: http
          - path: /api/a2a
            pathType: Exact
            backend:
              service:
                name: hub
                port:
                  name: http

